<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{{ PRODUCT_NAME }}}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Noto+Serif+KR:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./bundle-entry.css">
  <link rel="manifest" href="./manifest.json">

  <style>
    :root {
      --cream:       #F4EFE3;
      --cream-mid:   #EDE5D3;
      --cream-dark:  #E4DAC5;
      --ink:         #201C15;
      --ink-mid:     #5A5040;
      --ink-light:   #9A8A74;
      --rule:        rgba(110, 90, 65, 0.16);
      --rule-strong: rgba(110, 90, 65, 0.28);
      --accent:      #7A3320;
      --accent-warm: #A84830;
      --gold:        #AF8838;
      --border:      rgba(110, 90, 65, 0.22);
      --ff-heading:  'IM Fell English', 'Noto Serif KR', Georgia, serif;
      --ff-body:     'Lora', 'Noto Serif KR', Georgia, serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0C0A07; }

    #unity-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #root {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    #unity-loading-bar {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0C0A07;
      z-index: 100;
      transition: opacity 0.4s ease;
    }
    #unity-loading-bar.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #unity-progress-bar-empty {
      width: 240px;
      height: 2px;
      background: rgba(244, 239, 227, 0.15);
      border-radius: 1px;
      margin-top: 24px;
      overflow: hidden;
    }
    #unity-progress-bar-full {
      height: 100%;
      background: var(--cream);
      width: 0;
      transition: width 0.2s ease;
    }
    .loading-title {
      font-family: 'IM Fell English', Georgia, serif;
      font-size: 18px;
      color: var(--cream);
      opacity: 0.7;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="root"></div>

  <script>
    document.getElementById("unity-canvas").addEventListener("webglcontextlost", function(e) {
      e.preventDefault();
      window.__unityContextLost = true;
      window.dispatchEvent(new CustomEvent("unitycontextlost"));
    });
  </script>

  <div id="unity-loading-bar">
    <p class="loading-title">{{{ PRODUCT_NAME }}}</p>
    <div id="unity-progress-bar-empty">
      <div id="unity-progress-bar-full"></div>
    </div>
  </div>

  <script>
    var buildName = "{{{ UNITY_BUILD_NAME }}}";
    // Use Unity's filename macros so the extension (.unityweb when compressed)
    // is always correct regardless of compression / decompression-fallback settings.
    var loaderUrl = "Build/{{{ LOADER_FILENAME }}}";
    var config = {
      dataUrl:            "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl:       "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl:            "Build/{{{ CODE_FILENAME }}}",
      enableStreamingDownload: true,
      streamingAssetsUrl: "StreamingAssets",
      companyName:        "{{{ COMPANY_NAME }}}",
      productName:        "{{{ PRODUCT_NAME }}}",
      productVersion:     "{{{ PRODUCT_VERSION }}}",
      // Cache the big files immutably so kiosk reloads serve them from
      // IndexedDB instead of re-downloading. Overrides Unity's default
      // "must-revalidate" and survives every rebuild (set here, not in loader.js).
      cacheControl: function (url) {
        if (url == config.dataUrl || url == config.codeUrl || url == config.frameworkUrl)
          return "immutable";
        return "no-store";
      },
    };

    var loadingBar   = document.getElementById("unity-loading-bar");
    var progressFull = document.getElementById("unity-progress-bar-full");

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function() {
      var maxRetries = 3;
      var retryDelay = 3000;
      var canvas = document.getElementById("unity-canvas");

      function attemptLoad(attempt) {
        createUnityInstance(canvas, config, function(progress) {
          progressFull.style.width = (100 * progress) + "%";
        }).then(function(unityInstance) {
          loadingBar.classList.add("hidden");
          window.__unity = unityInstance;
        }).catch(function(message) {
          console.warn("Unity load attempt " + (attempt + 1) + " failed: " + message);
          if (attempt + 1 < maxRetries) {
            setTimeout(function() { attemptLoad(attempt + 1); }, retryDelay);
          } else {
            alert("Failed to load after " + maxRetries + " attempts. Check your connection and try refreshing.\n\n" + message);
          }
        });
      }

      attemptLoad(0);
    };
    document.body.appendChild(script);
  </script>

  <!-- SolidJS UI overlay — bridge waits for window.__unity before sending messages -->
  <script type="module" src="./bundle.js"></script>

</body>
</html>
